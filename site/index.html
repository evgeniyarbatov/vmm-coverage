<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VMM coverage map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  html, body { height: 100%; margin: 0; font-family: system-ui, sans-serif; color: #222; }
  #map, #tableView { position: absolute; top: 0; bottom: 0; left: 0; right: 0; }
  #map[hidden], #tableView[hidden] { display: none; }
  #banner {
    position: absolute; z-index: 1000; top: 12px; right: 12px;
    max-width: 460px; background: #fff; border: 1px solid #ccc; border-radius: 6px;
    padding: 10px 14px; font-size: 13px; line-height: 1.4; box-shadow: 0 1px 4px rgba(0,0,0,.2);
  }
  #banner h1 { font-size: 15px; margin: 0 0 4px; }
  #tabs { margin-top: 8px; display: flex; gap: 6px; }
  #tabs button {
    font: inherit; font-size: 12px; padding: 4px 10px; border-radius: 4px;
    border: 1px solid #999; background: #f2f2f2; cursor: pointer;
  }
  #tabs button.active { background: #2c3e50; color: #fff; border-color: #2c3e50; }
  #radiusNote { margin: 0 0 8px; font-size: 12px; color: #555; }
  #legend { position: absolute; z-index: 1000; bottom: 12px; right: 12px; background: #fff;
    border: 1px solid #ccc; border-radius: 6px; padding: 8px 12px; font-size: 12px; }
  #legend div { display: flex; align-items: center; gap: 6px; margin: 2px 0; }
  #legend span.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  #empty { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    font-size: 14px; color: #555; text-align: center; padding: 20px; }
  #tableView {
    overflow: auto; background: #fff; padding: 90px 20px 20px; box-sizing: border-box;
    display: flex; flex-direction: column; align-items: center;
  }
  #tableView h2 { font-size: 14px; margin: 20px 0 8px; }
  #tableView table { border-collapse: collapse; font-size: 13px; max-width: 640px; width: 100%; }
  #tableView th, #tableView td { border: 1px solid #ddd; padding: 6px 10px; text-align: left; }
  #tableView th { background: #f5f5f5; }
  #stats { display: flex; gap: 16px; flex-wrap: wrap; margin: 0 0 4px; justify-content: center; }
  #stats div { font-size: 12px; }
  #stats b { display: block; font-size: 16px; }
  #sourceLink {
    position: absolute; z-index: 1000; left: 50%; bottom: 12px; transform: translateX(-50%);
    background: rgba(255,255,255,.6); border: 1px solid #ccc; border-radius: 6px; padding: 6px 12px;
    font-size: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.2);
  }
</style>
</head>
<body>
<div id="banner">
  <h1>VMM Cell Coverage</h1>
  <div id="radiusNote" hidden></div>
  <div id="tabs">
    <button id="tabMap" class="active">Map</button>
    <button id="tabTable">By carrier</button>
  </div>
</div>
<div id="sourceLink">
  <a href="https://github.com/evgeniyarbatov/vmm-coverage" target="_blank" rel="noopener">Source</a>
</div>
<div id="legend">
  <div><span class="dot" style="background:#c0392b"></span> none</div>
  <div><span class="dot" style="background:#e67e22"></span> sparse</div>
  <div><span class="dot" style="background:#f1c40f"></span> moderate</div>
  <div><span class="dot" style="background:#27ae60"></span> dense</div>
  <div><span class="dot" style="background:#2c3e50;border-radius:2px;"></span> Base Station (OSM)</div>
</div>
<div id="map"></div>
<div id="tableView" hidden></div>
<div id="empty">No coverage data yet. Run <code>make fetch &amp;&amp; make run</code> and commit the
files under <code>site/</code> to populate this map.</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const SCORE_COLORS = { none: "#c0392b", sparse: "#e67e22", moderate: "#f1c40f", dense: "#27ae60" };

async function loadJson(path) {
  try {
    const resp = await fetch(path, { cache: "no-store" });
    if (!resp.ok) return null;
    return await resp.json();
  } catch {
    return null; // file:// blocks fetch of local files entirely (no response to check .ok on)
  }
}

function renderMap(geojson) {
  const map = L.map("map");
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "&copy; OpenStreetMap contributors",
    maxZoom: 18,
  }).addTo(map);

  const points = geojson.features.map(f => [f.geometry.coordinates[1], f.geometry.coordinates[0]]);
  map.fitBounds(points, { padding: [10, 10] });

  for (const f of geojson.features) {
    const [lon, lat] = f.geometry.coordinates;
    const p = f.properties;
    L.circleMarker([lat, lon], {
      radius: 4,
      color: SCORE_COLORS[p.score] || "#999",
      fillColor: SCORE_COLORS[p.score] || "#999",
      fillOpacity: 0.8,
      weight: 0,
    }).bindPopup(
      `km ${p.km} — ${p.score}<br>cells: ${p.cell_count}<br>` +
      `operators: ${(p.operators || []).join(", ") || "none"}<br>` +
      `nearest: ${p.nearest_m ? Math.round(p.nearest_m) + " m" : "n/a"}`
    ).addTo(map);
  }

  return map;
}

function renderOsmMasts(map, geojson) {
  const icon = L.divIcon({
    className: "",
    html: '<div style="width:8px;height:8px;background:#2c3e50;border-radius:2px;"></div>',
    iconSize: [8, 8],
  });
  for (const f of geojson.features) {
    const [lon, lat] = f.geometry.coordinates;
    const tags = f.properties.tags || {};
    const tagLines = Object.entries(tags).map(([k, v]) => `${k}: ${v}`).join("<br>");
    L.marker([lat, lon], { icon })
      .bindPopup(`OSM base station<br>${tagLines || "no tags"}`)
      .addTo(map);
  }
}

function renderRadiusNote(meta) {
  if (!meta) return;
  const km = (meta.search_radius_m / 1000).toFixed(1);
  const el = document.getElementById("radiusNote");
  el.textContent = `Search radius: ${km} km straight-line`;
  el.hidden = false;
}

function carrierStats(features) {
  const total = features.length;
  const counts = new Map();
  let noCarrier = 0;
  for (const f of features) {
    const ops = f.properties.operators || [];
    if (ops.length === 0) noCarrier++;
    for (const op of ops) counts.set(op, (counts.get(op) || 0) + 1);
  }
  const rows = [...counts.entries()]
    .map(([operator, points]) => ({ operator, points, pct: (points / total) * 100 }))
    .sort((a, b) => b.points - a.points);
  return { rows, total, noCarrier };
}

function renderTable(geojson, gaps) {
  const { rows, total, noCarrier } = carrierStats(geojson.features);
  const totalKm = geojson.features.length
    ? Math.max(...geojson.features.map(f => f.properties.km))
    : 0;
  const gapKm = gaps.reduce((sum, g) => sum + g.length_km, 0);

  const el = document.getElementById("tableView");
  el.innerHTML = `
    <div id="stats">
      <div><b>${totalKm.toFixed(1)} km</b>sampled</div>
      <div><b>${total}</b>points</div>
      <div><b>${gaps.length}</b>dead zones (${gapKm.toFixed(1)} km)</div>
    </div>
    <h2>Points with an observed carrier nearby</h2>
    <table>
      <thead><tr><th>Carrier</th><th>Points</th><th>% of track</th></tr></thead>
      <tbody>
        ${rows.map(r => `<tr><td>${r.operator}</td><td>${r.points}</td>` +
          `<td>${r.pct.toFixed(1)}%</td></tr>`).join("")}
        <tr><td>No carrier observed</td><td>${noCarrier}</td>
          <td>${((noCarrier / total) * 100).toFixed(1)}%</td></tr>
      </tbody>
    </table>
  `;
}

function setTab(tab) {
  const map = document.getElementById("map");
  const table = document.getElementById("tableView");
  const legend = document.getElementById("legend");
  const tabMap = document.getElementById("tabMap");
  const tabTable = document.getElementById("tabTable");
  map.hidden = tab !== "map";
  table.hidden = tab !== "table";
  legend.hidden = tab !== "map";
  tabMap.classList.toggle("active", tab === "map");
  tabTable.classList.toggle("active", tab === "table");
}

async function main() {
  const geojson = await loadJson("coverage.geojson");
  if (!geojson || !geojson.features.length) {
    document.getElementById("empty").style.display = "flex";
    return;
  }
  const gaps = (await loadJson("gaps.json")) || [];
  const osmMasts = await loadJson("osm_masts.geojson");
  const meta = await loadJson("meta.json");

  const map = renderMap(geojson);
  if (osmMasts) renderOsmMasts(map, osmMasts);
  renderTable(geojson, gaps);
  renderRadiusNote(meta);

  const banner = document.getElementById("banner");
  document.getElementById("tableView").style.paddingTop = `${banner.offsetHeight + 20}px`;

  document.getElementById("tabMap").addEventListener("click", () => setTab("map"));
  document.getElementById("tabTable").addEventListener("click", () => setTab("table"));
}

main().catch(err => {
  console.error(err);
  document.getElementById("empty").textContent = "Failed to load the map: " + err.message;
  document.getElementById("empty").style.display = "flex";
});
</script>
</body>
</html>
